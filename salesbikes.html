<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bikes for Sale</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 400;
      background: #ffffff;
      color: #050505;
      line-height: 1.5;
    }

    header {
      background: #53a735;
      color: white;
      padding: 2.5rem 1.5rem;
      text-align: center;
    }

    header h1 {
      font-family: 'Trebuchet MS', Helvetica, sans-serif;
      font-size: 36px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.5px;
      margin-bottom: 0.25rem;
    }

    header p {
      font-size: 1rem;
      opacity: 0.9;
    }

    .sort-bar {
      max-width: 800px;
      margin: 1.5rem auto 0;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 14px;
      color: #555;
    }

    .sort-bar button {
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
      color: #333;
      transition: all 0.15s;
    }

    .sort-bar button.active {
      background: #53a735;
      color: white;
      border-color: #53a735;
    }

    .sort-bar button:hover:not(.active) {
      border-color: #53a735;
      color: #53a735;
    }

    #bikes {
      max-width: 800px;
      margin: 1rem auto 2rem;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .bike-card {
      background: white;
      border-radius: 5px;
      border: 1px solid #e0e0e0;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .bike-card:hover {
      border-color: #53a735;
    }

    .carousel {
      position: relative;
      background: #f0f0f0;
    }

    .carousel img {
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      display: block;
      background: #f0f0f0;
      cursor: pointer;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.4);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .carousel-btn:hover {
      background: rgba(0,0,0,0.7);
    }

    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }

    .carousel-counter {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.5);
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 13px;
    }

    .bike-card-body {
      padding: 1.5rem;
    }

    .bike-card h2 {
      font-family: 'Trebuchet MS', Helvetica, sans-serif;
      font-size: 24px;
      font-weight: 400;
      line-height: 1.5;
      margin-bottom: 0.75rem;
      color: #53a735;
    }

    .bike-card .description {
      font-size: 16px;
      color: #333;
      margin-bottom: 1rem;
    }

    .bike-card .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 15px 26px;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-decoration: none;
      text-transform: capitalize;
      transition: background 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn-price {
      background: #53a735;
      color: white;
      cursor: default;
    }

    .btn-inquire {
      background: white;
      color: #53a735;
      border: 2px solid #53a735;
    }

    .btn-inquire:hover {
      background: #53a735;
      color: white;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 95vw;
      max-height: 90vh;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      color: white;
      font-size: 36px;
      cursor: pointer;
    }

    .lightbox .carousel-btn {
      position: absolute;
      top: 50%;
    }

    .lightbox .carousel-btn.prev { left: 15px; }
    .lightbox .carousel-btn.next { right: 15px; }

    .lightbox .carousel-counter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      right: auto;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: #888;
      font-size: 1.1rem;
    }

    .error {
      text-align: center;
      padding: 3rem;
      color: #c0392b;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bikes for Sale</h1>
    <p>Quality bicycles supporting our community co-op</p>
  </header>

  <div class="sort-bar">
    Sort by:
    <button class="active" onclick="sortBikes('date')">Newest first</button>
    <button onclick="sortBikes('price-asc')">Price: low to high</button>
    <button onclick="sortBikes('price-desc')">Price: high to low</button>
  </div>

  <div id="bikes">
    <div class="loading">Loading bikes...</div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <button class="carousel-btn prev" onclick="lightboxNav(-1)">&#8249;</button>
    <img src="" alt="" referrerpolicy="no-referrer">
    <button class="carousel-btn next" onclick="lightboxNav(1)">&#8250;</button>
    <span class="carousel-counter"></span>
  </div>

  <script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/1V_8ExLOLyxVXeImMNdwBGJ9EKeqKqVVZPl_8DVevNC4/gviz/tq?tqx=out:json";
    const API_KEY = "AIzaSyC0x2Bbiq1YclQJtMBhBjZfrqYW-vdhBJQ";

    function extractFolderId(url) {
      const match = url.match(/folders\/([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }

    async function fetchImages(folderUrl) {
      const folderId = extractFolderId(folderUrl);
      if (!folderId) return [];
      const res = await fetch(
        `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+mimeType+contains+'image'&key=${API_KEY}&fields=files(id,name,thumbnailLink)&orderBy=name`
      );
      const data = await res.json();
      return (data.files || [])
        .filter(f => f.thumbnailLink)
        .map(f => f.thumbnailLink.replace(/=s\d+$/, '=s800'));
    }

    // Carousel
    const carouselData = {};

    function buildCarousel(images, alt, id) {
      if (images.length === 0) return "";
      if (images.length === 1) {
        return `<div class="carousel"><img src="${images[0]}" alt="${alt}" referrerpolicy="no-referrer" onclick="openLightbox('${id}', 0)"></div>`;
      }
      return `
        <div class="carousel" id="carousel-${id}">
          <img src="${images[0]}" alt="${alt}" referrerpolicy="no-referrer" onclick="openLightbox('${id}', carouselData['${id}'].index)">
          <button class="carousel-btn prev" onclick="carouselNav('${id}', -1)">&#8249;</button>
          <button class="carousel-btn next" onclick="carouselNav('${id}', 1)">&#8250;</button>
          <span class="carousel-counter">1 / ${images.length}</span>
        </div>
      `;
    }

    function carouselNav(id, dir) {
      const data = carouselData[id];
      data.index = (data.index + dir + data.images.length) % data.images.length;
      const carousel = document.getElementById('carousel-' + id);
      const img = carousel.querySelector('img');
      img.src = data.images[data.index];
      carousel.querySelector('.carousel-counter').textContent = `${data.index + 1} / ${data.images.length}`;
    }

    // Lightbox
    let lightboxId = null;
    let lightboxIndex = 0;
    const lightboxEl = document.getElementById('lightbox');

    function openLightbox(id, index) {
      lightboxId = id;
      lightboxIndex = index;
      updateLightbox();
      lightboxEl.classList.add('active');
    }

    function closeLightbox() {
      lightboxEl.classList.remove('active');
    }

    function lightboxNav(dir) {
      const data = carouselData[lightboxId];
      lightboxIndex = (lightboxIndex + dir + data.images.length) % data.images.length;
      updateLightbox();
    }

    function updateLightbox() {
      const data = carouselData[lightboxId];
      lightboxEl.querySelector('img').src = data.images[lightboxIndex];
      lightboxEl.querySelector('.carousel-counter').textContent = `${lightboxIndex + 1} / ${data.images.length}`;
    }

    lightboxEl.addEventListener('click', function(e) {
      if (e.target === lightboxEl) closeLightbox();
    });

    document.addEventListener('keydown', function(e) {
      if (!lightboxEl.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') lightboxNav(-1);
      if (e.key === 'ArrowRight') lightboxNav(1);
    });

    // Parse Google Sheets date string like "Date(2026,1,6)"
    function parseGSDate(v) {
      const m = v.match(/Date\((\d+),(\d+),(\d+)\)/);
      if (!m) return new Date(0);
      return new Date(+m[1], +m[2], +m[3]);
    }

    // Bike data and sort state
    let bikes = [];
    let currentSort = 'date';

    function sortBikes(mode) {
      currentSort = mode;
      document.querySelectorAll('.sort-bar button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderBikes();
    }

    function renderBikes() {
      const sorted = [...bikes];
      if (currentSort === 'date') sorted.sort((a, b) => b.date - a.date);
      else if (currentSort === 'price-asc') sorted.sort((a, b) => a.price - b.price);
      else if (currentSort === 'price-desc') sorted.sort((a, b) => b.price - a.price);

      const container = document.getElementById("bikes");
      container.innerHTML = "";

      for (const bike of sorted) {
        const el = document.createElement("div");
        el.className = "bike-card";

        let carouselHtml = "";
        if (bike.images.length > 0) {
          carouselData[bike.id] = { images: bike.images, index: 0 };
          carouselHtml = buildCarousel(bike.images, bike.name, bike.id);
        }

        const mailto = `mailto:bikesale@rueckenwind.berlin?subject=${encodeURIComponent('Inquiry: ' + bike.name)}`;

        el.innerHTML = `
          ${carouselHtml}
          <div class="bike-card-body">
            <h2>${bike.name}</h2>
            <div class="description">${bike.desc.replace(/\n/g, '<br>')}</div>
            <div class="actions">
              <span class="btn btn-price">${bike.price} EUR</span>
              <a class="btn btn-inquire" href="${mailto}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13 2 4"/></svg>Inquire</a>
            </div>
          </div>
        `;
        container.appendChild(el);
      }
    }

    // Load bikes
    async function loadBikes() {
      try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        const start = text.indexOf('(');
        const end = text.lastIndexOf(')');
        const json = JSON.parse(text.substring(start + 1, end));
        const rows = json.table.rows;

        for (const row of rows) {
          const dateVal = row.c[0]?.v;
          const name = row.c[1]?.v;
          const price = row.c[2]?.v;
          const desc = row.c[3]?.v;
          const folderUrl = row.c[4]?.v;
          const id = 'bike-' + name.replace(/\W+/g, '-').toLowerCase();

          let images = [];
          if (folderUrl) {
            images = await fetchImages(folderUrl);
          }

          bikes.push({
            id,
            date: dateVal ? parseGSDate(dateVal) : new Date(0),
            name,
            price,
            desc,
            images,
          });
        }

        renderBikes();
      } catch (err) {
        console.error("Failed to load bikes:", err);
        document.getElementById("bikes").innerHTML = '<div class="error">Failed to load bike listings.</div>';
      }
    }

    loadBikes();
  </script>
</body>
</html>
